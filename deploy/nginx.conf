# /etc/nginx/sites-available/the-hub-vrc.fr
#
# Next.js écoute en local sur 127.0.0.1:3200 ; nginx est le seul exposé.
# Une fois certbot passé (voir docs/DEPLOIEMENT.md), il réécrit ce fichier pour
# ajouter le bloc TLS et la redirection 80 -> 443.

server {
    listen 80;
    listen [::]:80;
    server_name the-hub-vrc.fr www.the-hub-vrc.fr;

    # Taille des images déposées (le code plafonne à 5 Mo, on laisse un peu d'air).
    client_max_body_size 8M;

    # Compression : les pages Next sont du HTML/JS très compressible.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Assets versionnés par Next : le nom change à chaque build, donc immuables.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Indispensable derrière un proxy : sans ça Auth.js construit ses URLs
        # de callback en http et la connexion Discord casse en HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
