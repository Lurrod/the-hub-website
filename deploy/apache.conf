# /etc/apache2/sites-available/the-hub-vrc.fr.conf
#
# Next.js écoute en local sur 127.0.0.1:3200 ; Apache est le seul exposé.
# Modules requis : proxy, proxy_http, headers, deflate, ssl, rewrite.
#
# Les deux VirtualHost sont versionnés ici plutôt que laissés à la génération
# `certbot --apache` : sans cela, la configuration réellement en production
# n'était reconstructible depuis le dépôt, et rien ne garantissait la
# redirection HTTPS ni sa persistance après une réinstallation.
#
# Premier déploiement : lancer `certbot certonly --apache -d the-hub-vrc.fr -d
# www.the-hub-vrc.fr`, qui dépose les certificats aux chemins ci-dessous.

<VirtualHost *:80>
    ServerName the-hub-vrc.fr
    ServerAlias www.the-hub-vrc.fr

    # Le port 80 ne sert plus qu'à rediriger. Exception : le challenge HTTP-01
    # de certbot, qui doit rester servi en clair pour le renouvellement.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{SERVER_NAME}/$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/the-hub-vrc.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/the-hub-vrc.fr-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName the-hub-vrc.fr
    ServerAlias www.the-hub-vrc.fr

    SSLEngine On
    # Durcissement TLS maintenu par certbot : versions de protocole, suites de
    # chiffrement, tickets de session. Ce fichier est mis à jour par les montées
    # de version de certbot — le recopier ici le figerait, l'inclure garde le
    # bénéfice des mises à jour. Sans cette ligne, reprendre la main sur le
    # VirtualHost 443 reviendrait à revenir aux réglages TLS par défaut d'Apache.
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile      /etc/letsencrypt/live/the-hub-vrc.fr/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/the-hub-vrc.fr/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # Auth.js reconstruit ses URLs de callback à partir de cet en-tête. La forme
    # `expr=%{REQUEST_SCHEME}` vaut https ici et http dans le VirtualHost de
    # redirection : une valeur figée casserait la connexion Discord.
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ProxyPass / http://127.0.0.1:3200/
    ProxyPassReverse / http://127.0.0.1:3200/

    # Images déposées : le code plafonne à 5 Mo, on laisse un peu d'air.
    LimitRequestBody 8388608

    # Assets versionnés par Next : le nom change à chaque build, donc immuables.
    <LocationMatch "^/_next/static/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # HSTS est aussi émis par Next (next.config.ts). L'imposer ici le garantit
    # sur les réponses qu'Apache produit lui-même — 502 quand Node est arrêté,
    # 413 sur un envoi trop lourd — que l'application ne voit jamais passer.
    #
    # Les deux lignes sont nécessaires et agissent sur des tables distinctes :
    # `unset` retire celui remonté par le proxy depuis Next, `always set` pose
    # le nôtre y compris sur les réponses d'erreur. Sans le `unset`, l'en-tête
    # sortait en double.
    Header unset Strict-Transport-Security
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"

    AddOutputFilterByType DEFLATE text/html text/plain text/css application/javascript application/json image/svg+xml

    ErrorLog ${APACHE_LOG_DIR}/the-hub-vrc.fr-error.log
    CustomLog ${APACHE_LOG_DIR}/the-hub-vrc.fr-access.log combined
</VirtualHost>
