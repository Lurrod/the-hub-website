name: CI

# Contrôles exécutés sur chaque pull request, et sur `main` après un merge.
#
# `push` était branché sur toutes les branches : chaque poussée sur une branche
# de PR déclenchait donc DEUX runs identiques, l'un pour le push, l'autre pour
# la PR. Coût doublé, et deux fois plus d'occasions de tomber sur un check-run
# fantôme — un `e2e` est resté bloqué en `in_progress` le 11 août alors que son
# run était terminé, figeant la vue de la PR. Une branche est désormais
# couverte par sa PR ; `main` l'est par le push qui suit le merge.
on:
  push:
    branches: [main]
  pull_request:

# Une nouvelle poussée rend le run précédent caduc : l'annuler libère le runner
# au lieu de faire la queue derrière un résultat que personne ne lira.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # Postgres sert uniquement de base d'ombre à la vérification de dérive :
    # `prisma migrate diff` y rejoue les migrations pour les comparer au
    # schéma. Aucune donnée du site n'y transite.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: drift
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Formatage
        # Sans cette étape, la dérive de formatage n'était détectée par personne :
        # l'audit du 6 août 2026 a trouvé 222 fichiers non conformes (QUAL-01).
        # `* text=auto eol=lf` dans .gitattributes garantit que les fins de ligne
        # arrivent en LF sur le disque du runner comme sur un poste Windows.
        run: npm run format:check

      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Dérive entre le schéma et les migrations
        # `Team_lfp_idx` a vécu six jours en base sans être déclaré dans le
        # schéma : créé par 20260805180000_team_lfp, jamais repris dans
        # schema.prisma. Personne ne l'a vu, et la migration suivante proposait
        # de le supprimer — en production, sur un index qui sert la page LFP.
        #
        # `--exit-code` renvoie 2 quand un écart subsiste : la CI échoue tant
        # que les migrations ne reconstruisent pas exactement le schéma.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/drift
        run: |
          npx prisma migrate diff             --from-migrations prisma/migrations             --to-schema-datamodel prisma/schema.prisma             --shadow-database-url "$DATABASE_URL"             --exit-code

      - name: Tests unitaires et couverture
        # Les seuils sont dans vitest.config.ts et font office de cliquet :
        # la couverture ne peut plus baisser sans faire échouer la CI.
        run: npm run test:coverage

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - name: Audit des dépendances
        # Bloque sur une vulnérabilité haute ou critique. Les niveaux inférieurs
        # sont signalés par la sortie sans faire échouer la CI.
        run: npm audit --audit-level=high

      - name: Build de production
        # DATABASE_URL est requis pour instancier le client Prisma pendant le
        # build. Aucune connexion réelle n'est ouverte : une URL factice suffit.
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/build
          AUTH_SECRET: build-only-placeholder
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thehub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thehub_test
      AUTH_SECRET: e2e-only-placeholder
      NEXTAUTH_URL: http://localhost:3200
      # `npm run start` sert le build de production : Auth.js y refuse tout hôte
      # non déclaré et chaque rendu levait UntrustedHost. En développement la
      # confiance est implicite, d'où un problème invisible en local.
      AUTH_TRUST_HOST: "true"
      # Signale à playwright.config.ts qu'il doit servir le build de production
      # plutôt que le serveur de développement.
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Appliquer le schéma
        run: npx prisma migrate deploy

      - name: Jeu de données de démonstration
        # Les scénarios Playwright s'appuient sur les fixtures de seed-dev
        # (Alpha Esports, joueurs, pages admin…).
        run: npm run db:seed:dev

      - name: Équipes VCT EMEA
        # Fournit les huit équipes « vlr-* » (Team Heretics, Fnatic…) dont
        # dépendent les tournois de démonstration des formats.
        run: npm run db:seed:vlr

      - name: Tournois de démonstration des formats
        # Crée les tournois « fmt-* » ciblés par la suite Playwright, puis
        # supprime les autres (--prune) pour reproduire l'état de la base de
        # développement sur laquelle la suite est vérifiée.
        run: npm run db:seed:formats -- --prune

      - name: Jeu de fixtures
        # Après le prune, qui ne garde que les tournois qu'il déclare : lancé
        # avant, ce seed serait effacé.
        #
        # Il apporte ce qu'aucun autre ne produit : des `PlayerGameStat`. Sans
        # eux, aucun match de la CI n'avait de scoreboard, et le scoreboard,
        # le sélecteur de cartes de partage, l'onglet cumulé et le rating
        # n'étaient jamais rendus — donc jamais testés de bout en bout.
        run: npm run db:seed:fixtures

      - name: Build de production
        run: npm run build

      - name: Installer les navigateurs
        run: npx playwright install --with-deps chromium

      - name: Tests end-to-end
        run: npm run test:e2e

      - name: Rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
