name: Déploiement (Kimsufi)

# Le jeton hérite sinon du réglage par défaut du dépôt, historiquement
# `contents: write` : chaque étape exécutant du code tiers (npm ci et ses
# centaines de paquets transitifs, prisma generate, playwright install)
# disposerait d'un jeton capable d'écrire dans le dépôt. Aucun de ces
# workflows n'en a besoin — `upload-artifact` non plus.
permissions:
  contents: read

# Déclenché par la FIN de la CI sur main, jamais par le push lui-même.
#
# Les deux workflows étaient auparavant branchés sur `push: main` et partaient
# donc en parallèle sur le même commit : le déploiement n'attendait pas le
# verdict de la CI. Or il ne rejoue que trois de ses neuf contrôles — ni lint,
# ni format:check, ni `prisma migrate diff`, ni `npm audit`, ni les seuils de
# couverture, ni les 19 parcours Playwright. Une régression détectée par
# Playwright ou une dérive de migration partaient en production, la CI ne
# virant au rouge qu'après la mise en ligne.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # Un seul déploiement à la fois : deux envois simultanés casseraient la release.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    # Le déclenchement manuel reste possible sans CI préalable ; c'est la porte
    # de sortie quand il faut remettre en ligne vite. Tout le reste exige une CI
    # verte sur main. Le test sur `head_branch` est une ceinture : le filtre
    # `branches` ci-dessus écarte déjà les runs de CI issus des pull requests.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main')
    steps:
      - uses: actions/checkout@v4
        with:
          # `workflow_run` s'exécute dans le contexte de la branche par défaut :
          # sans `ref` explicite, on déploierait le HEAD de main et non le commit
          # que la CI vient précisément de valider. Les deux diffèrent dès qu'un
          # second merge est passé pendant que la CI tournait.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Générer le client Prisma
        run: npx prisma generate

      # Ces deux contrôles font doublon avec la CI, qui vient de passer au vert
      # sur ce commit. Ils restent parce que `workflow_dispatch` court-circuite
      # la CI : sans eux, un déploiement manuel n'aurait plus aucun garde-fou.
      # Deux minutes de runner pour ne pas laisser un trou dans la seule porte
      # qui ouvre la production sans contrôle.
      - name: Vérification des types
        run: npx tsc --noEmit

      - name: Tests unitaires
        run: npm test

      - name: Build de production
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/build
          AUTH_SECRET: build-only-placeholder
        run: npm run build

      - name: Assembler le paquet à déployer
        # `output: "standalone"` ne recopie ni les assets statiques ni /public :
        # Next attend qu'on les place à côté du serveur.
        run: |
          mkdir -p release
          cp -r .next/standalone/. release/
          mkdir -p release/.next
          cp -r .next/static release/.next/static
          # `public/.` et non `public` : le traçage de fichiers de Next place
          # dans le standalone les fichiers de `public/` lus par le serveur (le
          # logo des images de partage). `release/public` existe donc déjà, et
          # `cp -r public release/public` y imbriquerait un second `public/` au
          # lieu d'en remplir le contenu — tout le reste de `public/` devenait
          # alors introuvable en production.
          mkdir -p release/public
          cp -r public/. release/public/
          # Migrations + schéma : `prisma migrate deploy` tourne sur le serveur.
          cp -r prisma release/prisma
          cp ecosystem.config.cjs release/
          # Scripts de maintenance, en .mjs pour tourner avec le Node et le
          # client Prisma de la release : le standalone n'embarque ni tsx ni les
          # dépendances de développement. Copiés un par un et non `cp -r scripts` :
          # les scripts d'amorçage `seed-*` sont des données de démonstration et
          # n'ont rien à faire en production.
          mkdir -p release/scripts
          cp scripts/prune-orphan-images.mjs release/scripts/
          cp scripts/sync-tournament-statuses.mjs release/scripts/
          cp scripts/recalibrate-ratings.mjs release/scripts/
          # Le seul .sh du lot : il n'appelle pas Prisma, il tape la route de
          # synchronisation Premier sur la boucle locale. Versionné parce que
          # trois collages successifs l'ont mutilé quand il était tenu à la main
          # dans `shared/`, dont un `cat >` qui l'a vidé sans le réécrire.
          cp scripts/premier-sync.sh release/scripts/
          # Le traçage de fichiers de Next embarque un dossier `uploads` s'il
          # existe au moment du build. Il doit être un lien vers le volume
          # persistant du serveur, pas un vrai dossier livré avec la release.
          rm -rf release/uploads release/.env
          tar -czf release.tar.gz -C release .

      - name: Préparer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Épingle l'empreinte du serveur : sans ça, une attaque active
          # pourrait se faire passer pour le Kimsufi pendant le déploiement.
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Envoyer la release
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
        run: scp -P "$PORT" release.tar.gz "$USER@$HOST:/tmp/the-hub-release.tar.gz"

      - name: Activer la nouvelle version
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
          APP_DIR: ${{ secrets.APP_DIR }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" APP_DIR="$APP_DIR" 'bash -euo pipefail -s' <<'REMOTE'
            # Garde-fou : refuse de déployer dans un dossier qui n'a pas été
            # préparé par la procédure d'exploitation (tenue hors dépôt).
            # Évite d'écraser un autre site si APP_DIR est mal renseigné.
            if [ ! -f "$APP_DIR/shared/.env" ]; then
              echo "ERREUR : $APP_DIR/shared/.env introuvable."
              echo "Le dossier n'est pas initialise, ou APP_DIR pointe au mauvais endroit."
              exit 1
            fi

            RELEASE="$APP_DIR/releases/$(date +%Y%m%d%H%M%S)"
            mkdir -p "$RELEASE"
            tar -xzf /tmp/the-hub-release.tar.gz -C "$RELEASE"
            rm /tmp/the-hub-release.tar.gz

            # Éléments persistants : jamais dans la release, sinon un déploiement
            # effacerait les images déjà envoyées par les utilisateurs.
            # Le rm est indispensable : `ln -s cible dossier_existant` créerait
            # le lien *dans* le dossier au lieu de le remplacer.
            rm -rf "$RELEASE/uploads" "$RELEASE/.env"
            ln -s "$APP_DIR/shared/uploads" "$RELEASE/uploads"
            ln -s "$APP_DIR/shared/.env" "$RELEASE/.env"

            # Cache d'optimisation d'images de Next. Chaque release est un
            # dossier neuf : sans ce lien, le cache repart vide à chaque
            # déploiement et le premier visiteur de chaque page relance sharp
            # sur toutes les vignettes — sur un process unique, ça se sent.
            mkdir -p "$APP_DIR/shared/next-image-cache"
            mkdir -p "$RELEASE/.next/cache"
            rm -rf "$RELEASE/.next/cache/images"
            ln -s "$APP_DIR/shared/next-image-cache" "$RELEASE/.next/cache/images"

            cd "$RELEASE"

            # Secrets exportés dans l'environnement : pm2 les transmet au process
            # grâce à --update-env. `set -a` exporte tout ce qui est affecté.
            set -a
            . "$APP_DIR/shared/.env"
            set +a

            # Migrations avant bascule : le nouveau code suppose le nouveau schéma.
            npx --yes prisma@6 migrate deploy --schema prisma/schema.prisma

            ln -sfn "$RELEASE" "$APP_DIR/current"

            # delete + start, et non `startOrReload` : pm2 ne met à jour ni le
            # chemin du script ni le cwd d'un process existant. Il relançait donc
            # indéfiniment la toute première release, malgré des redémarrages
            # apparemment réussis à chaque déploiement.
            pm2 delete the-hub >/dev/null 2>&1 || true
            pm2 start ecosystem.config.cjs --update-env
            pm2 save

            # Vérifie que pm2 exécute bien la release qu'on vient de livrer.
            RUNNING=$(pm2 jlist | node -e "
              let d = '';
              process.stdin.on('data', c => d += c).on('end', () => {
                const app = JSON.parse(d).find(p => p.name === 'the-hub');
                console.log(app ? app.pm2_env.pm_cwd : '');
              });
            ")
            if [ "$RUNNING" != "$RELEASE" ]; then
              echo "ERREUR : pm2 execute $RUNNING au lieu de $RELEASE"
              exit 1
            fi

            # Ne conserver que les 5 dernières releases.
            ls -1dt "$APP_DIR"/releases/*/ | tail -n +6 | xargs -r rm -rf
          REMOTE

      - name: Vérifier que le site répond
        env:
          HOST: ${{ secrets.SSH_HOST }}
          USER: ${{ secrets.SSH_USER }}
          PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          ssh -p "$PORT" "$USER@$HOST" 'for i in $(seq 1 15); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3200/ || true)
              [ "$code" = "200" ] && echo "OK ($code)" && exit 0
              sleep 2
            done
            echo "Le service ne repond pas"; pm2 logs the-hub --lines 40 --nostream; exit 1'
